<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RV Level</title>
    <link rel="apple-touch-icon" href="./icon.jpeg">
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RV Level">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 32px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #a8d8ea;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .btn {
            display: block;
            width: 100%;
            max-width: 320px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
            margin-bottom: 24px;
        }
        .btn:active { transform: scale(0.97); opacity: 0.85; }

        #btnStart { background: #27ae60; color: #fff; }
        #btnStop  { background: #e74c3c; color: #fff; display: none; }

        .grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 140px minmax(0, 1fr);
            grid-template-rows: 1fr 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 420px;
            align-items: stretch;
        }

        .corner {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 14px;
            padding: 14px 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 90px;
            overflow: hidden;
        }

        .corner-label {
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #7f8c8d;
            margin-bottom: 6px;
            white-space: nowrap;
        }

        .corner-value {
            font-size: clamp(1.2rem, 5vw, 2rem);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: #27ae60;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .corner-value.warn  { color: #f39c12; }
        .corner-value.alert { color: #e74c3c; }

        .corner-unit {
            font-size: 0.7rem;
            color: #7f8c8d;
            margin-top: 4px;
            white-space: nowrap;
        }

        .rv-image {
            grid-column: 2;
            grid-row: 1 / 4;
            width: 140px;
        }
        .rv-image img {
            width: 100%;
            border-radius: 10px;
            opacity: 0.9;
        }

        /* corner positions */
        .fl { grid-column: 1; grid-row: 1; }
        .fr { grid-column: 3; grid-row: 1; }
        .rl { grid-column: 1; grid-row: 3; }
        .rr { grid-column: 3; grid-row: 3; }

        /* install banner */
        #install-banner {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #0f3460;
            border-top: 1px solid #a8d8ea44;
            padding: 14px 16px;
            z-index: 999;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to   { transform: translateY(0); }
        }
        #install-banner.visible { display: block; }

        .banner-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .banner-icon { font-size: 1.6rem; flex-shrink: 0; }
        .banner-text { flex: 1; font-size: 0.88rem; line-height: 1.4; color: #e0e0e0; }
        .banner-text strong { color: #a8d8ea; }
        .banner-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

        .btn-install {
            background: #a8d8ea;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-dismiss {
            background: transparent;
            border: 1px solid #7f8c8d;
            border-radius: 8px;
            color: #7f8c8d;
            padding: 8px 10px;
            font-size: 0.85rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>RV Level</h1>

    <button id="btnStart" class="btn" onclick="start()">Start</button>
    <button id="btnStop"  class="btn" onclick="stop()">Stop</button>

    <div class="grid">
        <div class="corner fl">
            <div class="corner-label">Front Left</div>
            <div class="corner-value" id="FL">—</div>
            <div class="corner-unit">inches</div>
        </div>

        <div class="rv-image">
            <img src="top-view.jpeg" alt="RV top view" />
        </div>

        <div class="corner fr">
            <div class="corner-label">Front Right</div>
            <div class="corner-value" id="FR">—</div>
            <div class="corner-unit">inches</div>
        </div>

        <div class="corner rl">
            <div class="corner-label">Rear Left</div>
            <div class="corner-value" id="RL">—</div>
            <div class="corner-unit">inches</div>
        </div>

        <div class="corner rr">
            <div class="corner-label">Rear Right</div>
            <div class="corner-value" id="RR">—</div>
            <div class="corner-unit">inches</div>
        </div>
    </div>

    <!-- install banner -->
    <div id="install-banner">
        <div class="banner-row">
            <div class="banner-icon" id="banner-icon">📲</div>
            <div class="banner-text" id="banner-text"></div>
            <div class="banner-actions">
                <button class="btn-install" id="btn-install" style="display:none" onclick="triggerInstall()">Install</button>
                <button class="btn-dismiss" onclick="dismissBanner()">✕</button>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
    <script>
        // --- Install prompt logic ---
        let deferredPrompt = null;

        const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
        const isInstalled = window.navigator.standalone === true ||
            window.matchMedia('(display-mode: standalone)').matches;

        function dismissBanner() {
            document.getElementById('install-banner').classList.remove('visible');
            localStorage.setItem('installDismissed', '1');
        }

        function triggerInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
                dismissBanner();
            }
        }

        function showBanner(mode) {
            if (localStorage.getItem('installDismissed')) return;
            const text = document.getElementById('banner-text');
            if (mode === 'ios') {
                document.getElementById('banner-icon').textContent = '📤';
                text.innerHTML = 'Install <strong>RV Level</strong> on your iPhone: tap <strong>Share</strong> then <strong>"Add to Home Screen"</strong>.';
            } else {
                document.getElementById('banner-icon').textContent = '📲';
                text.innerHTML = 'Install <strong>RV Level</strong> as an app for quick offline access.';
                document.getElementById('btn-install').style.display = 'block';
            }
            document.getElementById('install-banner').classList.add('visible');
        }

        if (!isInstalled) {
            if (isIOS) {
                showBanner('ios');
            } else {
                window.addEventListener('beforeinstallprompt', e => {
                    e.preventDefault();
                    deferredPrompt = e;
                    showBanner('android');
                });
            }
        }
        // --- End install prompt logic ---

        const RVLen = 159;
        const RVWidth = 71.5;
        let north = 0.0;

        function setCorner(id, value) {
            const el = document.getElementById(id);
            el.innerText = '' + Math.round(10 * value) / 10;
            el.className = 'corner-value' +
                (value < 0.5 ? '' : value < 3 ? ' warn' : ' alert');
        }

        async function start() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                await DeviceOrientationEvent.requestPermission();
            }
            window.addEventListener('deviceorientation', handleOrientationEvent);
            document.getElementById('btnStart').style.display = 'none';
            document.getElementById('btnStop').style.display = 'block';
        }

        async function stop() {
            window.removeEventListener('deviceorientation', handleOrientationEvent);
            document.getElementById('btnStart').style.display = 'block';
            document.getElementById('btnStop').style.display = 'none';
        }

        function getTanFromDegrees(deg) {
            return Math.tan((deg * Math.PI) / 180);
        }

        function handleOrientationEvent(event) {
            const frontToBack = event.beta;
            const leftToRight = event.gamma;
            north = event.alpha;

            let back_offset  = RVLen   * getTanFromDegrees(frontToBack);
            let right_offset = RVWidth * getTanFromDegrees(leftToRight);

            let FL = 0, FR = 0, RL = 0, RR = 0;
            if (back_offset > 0) { RL = RR = back_offset; }
            else                  { FL = FR = -back_offset; }

            if (right_offset > 0) { FR += right_offset; RR += right_offset; }
            else                  { FL += -right_offset; RL += -right_offset; }

            const minVal = Math.min(FL, FR, RL, RR);
            FL -= minVal; FR -= minVal; RL -= minVal; RR -= minVal;

            setCorner('FL', FL);
            setCorner('FR', FR);
            setCorner('RL', RL);
            setCorner('RR', RR);
        }
    </script>
</body>
</html>
