<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RV Level</title>
    <link rel="apple-touch-icon" href="./icon.jpeg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RV Level">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 32px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #a8d8ea;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .btn {
            display: block;
            width: 100%;
            max-width: 320px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
            margin-bottom: 24px;
        }
        .btn:active { transform: scale(0.97); opacity: 0.85; }

        #btnStart { background: #27ae60; color: #fff; }
        #btnStop  { background: #e74c3c; color: #fff; display: none; }

        .grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            grid-template-rows: auto auto auto;
            gap: 10px;
            width: 100%;
            max-width: 420px;
            align-items: center;
        }

        .corner {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 14px;
            padding: 14px 10px;
            text-align: center;
        }

        .corner-label {
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #7f8c8d;
            margin-bottom: 6px;
        }

        .corner-value {
            font-size: 2rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: #27ae60;
            line-height: 1;
        }

        .corner-value.warn  { color: #f39c12; }
        .corner-value.alert { color: #e74c3c; }

        .corner-unit {
            font-size: 0.7rem;
            color: #7f8c8d;
            margin-top: 4px;
        }

        .rv-image {
            grid-column: 2;
            grid-row: 1 / 4;
            width: 140px;
        }
        .rv-image img {
            width: 100%;
            border-radius: 10px;
            opacity: 0.9;
        }

        /* corner positions */
        .fl { grid-column: 1; grid-row: 1; }
        .fr { grid-column: 3; grid-row: 1; }
        .rl { grid-column: 1; grid-row: 3; }
        .rr { grid-column: 3; grid-row: 3; }
    </style>
</head>
<body>
    <h1>RV Level</h1>

    <button id="btnStart" class="btn" onclick="start()">Start</button>
    <button id="btnStop"  class="btn" onclick="stop()">Stop</button>

    <div class="grid">
        <div class="corner fl">
            <div class="corner-label">Front Left</div>
            <div class="corner-value" id="FL">—</div>
            <div class="corner-unit">inches</div>
        </div>

        <div class="rv-image">
            <img src="top-view.jpeg" alt="RV top view" />
        </div>

        <div class="corner fr">
            <div class="corner-label">Front Right</div>
            <div class="corner-value" id="FR">—</div>
            <div class="corner-unit">inches</div>
        </div>

        <div class="corner rl">
            <div class="corner-label">Rear Left</div>
            <div class="corner-value" id="RL">—</div>
            <div class="corner-unit">inches</div>
        </div>

        <div class="corner rr">
            <div class="corner-label">Rear Right</div>
            <div class="corner-value" id="RR">—</div>
            <div class="corner-unit">inches</div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
    <script>
        const RVLen = 159;
        const RVWidth = 71.5;
        let north = 0.0;

        function setCorner(id, value) {
            const el = document.getElementById(id);
            el.innerText = '' + Math.round(10 * value) / 10;
            el.className = 'corner-value' +
                (value < 0.5 ? '' : value < 3 ? ' warn' : ' alert');
        }

        async function start() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                await DeviceOrientationEvent.requestPermission();
            }
            window.addEventListener('deviceorientation', handleOrientationEvent);
            document.getElementById('btnStart').style.display = 'none';
            document.getElementById('btnStop').style.display = 'block';
        }

        async function stop() {
            window.removeEventListener('deviceorientation', handleOrientationEvent);
            document.getElementById('btnStart').style.display = 'block';
            document.getElementById('btnStop').style.display = 'none';
            ['FL','FR','RL','RR'].forEach(id => {
                document.getElementById(id).innerText = '—';
                document.getElementById(id).className = 'corner-value';
            });
        }

        function getTanFromDegrees(deg) {
            return Math.tan((deg * Math.PI) / 180);
        }

        function handleOrientationEvent(event) {
            const frontToBack = event.beta;
            const leftToRight = event.gamma;
            north = event.alpha;

            let back_offset  = RVLen   * getTanFromDegrees(frontToBack);
            let right_offset = RVWidth * getTanFromDegrees(leftToRight);

            let FL = 0, FR = 0, RL = 0, RR = 0;
            if (back_offset > 0) { RL = RR = back_offset; }
            else                  { FL = FR = -back_offset; }

            if (right_offset > 0) { FR += right_offset; RR += right_offset; }
            else                  { FL += -right_offset; RL += -right_offset; }

            const minVal = Math.min(FL, FR, RL, RR);
            FL -= minVal; FR -= minVal; RL -= minVal; RR -= minVal;

            setCorner('FL', FL);
            setCorner('FR', FR);
            setCorner('RL', RL);
            setCorner('RR', RR);
        }
    </script>
</body>
</html>
